name: Deploy Hrm to Hostinger Via FTP

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Angular App
        run: npm run build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: 'ftp.myloancrm.com'
          username: 'u641548194.hrms'
          password: 'Myloancrm@123$'
          port: '21'
          local-dir: dist/hrmodule-angular/
          server-dir: /public_html/hrm/
