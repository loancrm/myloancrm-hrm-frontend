<p-table 
  #templatesTable
  [value]="templates"
  [paginator]="true"
  [rows]="10"
  [lazy]="true"
  (onLazyLoad)="loadEmployees($event)"
  [showCurrentPageReport]="true"
  [responsiveLayout]="'scroll'"
  [paginator]="true"
  [rowsPerPageOptions]="[5, 10, 25, 50]"
  [totalRecords]="totaltemplatesCount"
  [globalFilterFields]="['templateId', 'templateName', 'templateType', 'status', 'createdBy']"
  [loading]="loading"
  responsiveLayout="scroll"
  scrollHeight="flex"
   currentPageReportTemplate="Showing {first} to {last} of {totalRecords} Templates"
  >
  
  <ng-template pTemplate="caption">
    <div class="row">
      <div class="col-md-12 d-flex justify-content-end">
        <button
          pButton
          type="button"
          label="Create Custom Template"
          icon="fa fa-plus"
          class="p-button-primary"
          (click)="goToCustomTemplate()">
        </button>
      </div>
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th>Template Id</th>
      <th>Template Name</th>
      <th>Template Type</th>
      <th>Status</th>
      <th>Created By</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-row>
    <tr>
      <td>{{ row.templateId }}</td>
      <td>{{ row.templateName }}</td>
      <td>{{ row.templateType }}</td>
      <!-- <td>{{ row.status === 1 ? 'Active' : 'Inactive' }}</td> -->
       <td>
  <span
    class="d-inline-flex align-items-center justify-content-start gap-2 text-nowrap"
    [ngStyle]="{
      backgroundColor: getTemplateStatusStyle(row.status).backgroundColor,
      color: getTemplateStatusStyle(row.status).textColor,
      height: '22px',
      width: getTemplateStatusStyle(row.status).width,
      borderRadius: '16px',
      fontSize: '12px',
      fontWeight: 500,
      paddingLeft: '8px'
    }"
  >
    <!-- Dot -->
    <span
      class="rounded-circle"
      [ngStyle]="{
        backgroundColor: getTemplateStatusStyle(row.status).dotColor,
        width: '8px',
        height: '8px',
        display: 'inline-block'
      }"
    ></span>

    <!-- Status Text -->
    {{ row.status === 1 ? 'Active' : 'Inactive' }}
  </span>
</td>

      <td>{{ row.createdBy }}</td>
      <!-- <td>
       
         <button
          pButton
          label="Edit"
          [disabled]="row.canEdit === 0"
          (click)="editTemplate(row.id)">
        </button>

        <button
          pButton
          [label]="row.status === 1 ? 'Inactive' : 'Active'"
          (click)="toggleStatus(row)"
        ></button>
      </td> -->
      <td>
        <div class="text-center">
          <div class="d-flex tableimage">
            <p-menu
            #menu
            appendTo="body"
            [model]="actionItems(row)"
            
            [popup]="true"
          ></p-menu>

          <!-- <img
            alt="Actions"
            src="../../../assets/images/menu/menu.svg"
            width="24"
            height="24"
            class="pointer-cursor"
            (click)="menu.toggle($event); $event.stopPropagation()"
          /> -->
          <img
            alt="Actions"
            src="../../../assets/images/menu/menu.svg"
            width="24"
            height="24"
            class="pointer-cursor"
            (click)="menu.toggle($event); $event.stopPropagation()"
          />

          </div>
        </div>
      </td>

    </tr>
  </ng-template>
</p-table>
