<p-table 
  #templatesTable
  [value]="templates"
  [paginator]="true"
  [rows]="10"
  [lazy]="true"
  (onLazyLoad)="loadEmployees($event)"
  [showCurrentPageReport]="true"
  [responsiveLayout]="'scroll'"
  [paginator]="true"
  [rowsPerPageOptions]="[5, 10, 25, 50]"
  [totalRecords]="totaltemplatesCount"
  [globalFilterFields]="['templateId', 'templateName', 'templateType', 'status', 'createdBy']"
  [loading]="loading"
  responsiveLayout="scroll"
  scrollHeight="flex"
   currentPageReportTemplate="Showing {first} to {last} of {totalRecords} Templates"
  >
  
  <ng-template pTemplate="caption">
    <div class="row">
      <div class="col-md-12 d-flex justify-content-end">
        <button
          pButton
          type="button"
          label="Create Custom Template"
          icon="fa fa-plus"
          class="p-button-primary"
          (click)="goToCustomTemplate()">
        </button>
      </div>
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th>Template Id</th>
      <th>Template Name</th>
      <th>Template Type</th>
      <th>Status</th>
      <th>Created By</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-row>
    <tr>
      <td>{{ row.templateId }}</td>
      <td>{{ row.templateName }}</td>
      <td>{{ row.templateType }}</td>
      <!-- <td>{{ row.status === 1 ? 'Active' : 'Inactive' }}</td> -->
       <td>
  <span
    class="d-inline-flex align-items-center justify-content-start gap-2 text-nowrap"
    [ngStyle]="{
      backgroundColor: getTemplateStatusStyle(row.status).backgroundColor,
      color: getTemplateStatusStyle(row.status).textColor,
      height: '22px',
      width: getTemplateStatusStyle(row.status).width,
      borderRadius: '16px',
      fontSize: '12px',
      fontWeight: 500,
      paddingLeft: '8px'
    }"
  >
    <!-- Dot -->
    <span
      class="rounded-circle"
      [ngStyle]="{
        backgroundColor: getTemplateStatusStyle(row.status).dotColor,
        width: '8px',
        height: '8px',
        display: 'inline-block'
      }"
    ></span>

    <!-- Status Text -->
    {{ row.status === 1 ? 'Active' : 'Inactive' }}
  </span>
</td>

      <td>
        <div class="text-center pointer-cursor tableimage">
          <div class="d-flex">

            <!-- ACTION MENU BUTTON -->
            <button
              class="action-icon-wrapper menu-icon-wrapper"
              [matMenuTriggerFor]="menu"
              aria-label="Actions"
              matTooltip="Actions"
              (click)="$event.stopPropagation()"
            >
              <lucide-icon
                name="MoreVertical"
                [size]="20"
                class="action-icon"
              ></lucide-icon>
            </button>

            <!-- MAT MENU -->
            <mat-menu #menu="matMenu">

              <!-- 🔒 DEFAULT TEMPLATE (canEdit = 0) -->
              <ng-container *ngIf="row.canEdit === 0">

                <button mat-menu-item (click)="showDefaultError()" class="matmenuimg">
                  <div class="menu-action-icon-wrapper">
                    <lucide-icon name="square-pen" [size]="18" class="menu-action-icon"></lucide-icon>
                  </div>
                  <span>Edit</span>
                </button>

                <button mat-menu-item (click)="showDefaultError()" class="matmenuimg">
                  <div class="menu-action-icon-wrapper">
                    <lucide-icon
                      [name]="row.status === 1 ? 'shield-ban' : 'shield-check'"
                      [size]="18"
                      class="menu-action-icon">
                    </lucide-icon>
                  </div>
                  <span>{{ row.status === 1 ? 'Inactive' : 'Active' }}</span>
                </button>

              </ng-container>

              <!-- ✅ CUSTOM TEMPLATE (canEdit = 1) -->
              <ng-container *ngIf="row.canEdit === 1">

                <!-- Edit -->
                <button
                  mat-menu-item
                  [disabled]="row.status === 0"
                  (click)="editTemplate(row.id)"
                  class="matmenuimg"
                >
                  <div class="menu-action-icon-wrapper">
                    <lucide-icon name="square-pen" [size]="18" class="menu-action-icon"></lucide-icon>
                  </div>
                  <span>Edit</span>
                </button>

                <!-- Toggle Status -->
                <button
                  mat-menu-item
                  (click)="toggleStatus(row)"
                  class="matmenuimg"
                >
                  <div class="menu-action-icon-wrapper">
                    <lucide-icon
                      [name]="row.status === 1 ? 'shield-ban' : 'shield-check'"
                      [size]="18"
                      class="menu-action-icon">
                    </lucide-icon>
                  </div>
                  <span>{{ row.status === 1 ? 'Inactive' : 'Active' }}</span>
                </button>

              </ng-container>

            </mat-menu>

          </div>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
